name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 src/ --count --max-line-length=120 --statistics --exit-zero

      - name: Run unit tests
        run: |
          pytest tests/ -v

      - name: Smoke-test the pipeline on synthetic data
        run: |
          python src/generate_synthetic_data.py --n-rows 5000 --fraud-rate 0.02
          PYTHONPATH=src python src/train.py --config config.yaml
          PYTHONPATH=src python src/evaluate.py --config config.yaml
