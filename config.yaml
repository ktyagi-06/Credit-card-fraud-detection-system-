# Central configuration for the fraud detection pipeline.
# Nothing in src/ should hardcode a path or hyperparameter that belongs here.

data:
  raw_path: "data/creditcard.csv"
  processed_dir: "data/processed"
  target_column: "Class"
  test_size: 0.15
  val_size: 0.15          # fraction of the remaining train set after test split
  random_state: 42

preprocessing:
  scale_columns: ["Time", "Amount"]
  drop_duplicates: true

resampling:
  method: "smote"          # options: smote, class_weight, none
  smote_sampling_strategy: 0.10   # minority:majority ratio after resampling
  random_state: 42

models:
  logistic_regression:
    enabled: true
    params:
      max_iter: 1000
      class_weight: "balanced"
  random_forest:
    enabled: true
    params:
      n_estimators: 200
      max_depth: 12
      class_weight: "balanced"
      random_state: 42
      n_jobs: -1
  xgboost:
    enabled: true
    params:
      n_estimators: 300
      max_depth: 6
      learning_rate: 0.1
      eval_metric: "aucpr"
      random_state: 42
  neural_net:
    enabled: true
    params:
      hidden_layers: [64, 32]
      dropout: 0.3
      epochs: 20
      batch_size: 256
      learning_rate: 0.001

evaluation:
  primary_metric: "pr_auc"
  target_precision_for_recall_report: 0.90
  output_dir: "reports"

artifacts:
  model_dir: "models"
